name: Build and Upload iOS to Appetize

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios-appetize:
    name: Build & Upload to Appetize
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator --no-codesign

      - name: Zip Simulator Build (.app)
        run: |
          cd build/ios/iphonesimulator
          zip -r app.zip Runner.app

      - name: Upload to Appetize.io
        run: |
          TOKEN="tok_tv3ikuxequqr5p4na7smk27zju"
          
          echo "Uploading build/ios/iphonesimulator/app.zip to Appetize.io..."

          RESPONSE=$(curl --silent --show-error --location \
            --request POST "https://api.appetize.io/v1/apps" \
            -H "Authorization: Bearer $TOKEN" \
            -u "$TOKEN:" \
            --form "file=@build/ios/iphonesimulator/app.zip" \
            --form "platform=ios" \
            --form "token=$TOKEN")

          echo "Appetize Response:"
          echo "$RESPONSE"
